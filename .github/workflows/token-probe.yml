name: Private Token Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/token-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe private repository contents permission
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          SOURCE_SHA: 96162b1dc4e05c9464a5f87ed8ff4ccd4fce4f82
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/MetaUoa/clash-relay/contents/pyproject.toml?ref=${SOURCE_SHA}")
          echo "private-contents-http=${status}"
          test "$status" = "200"
