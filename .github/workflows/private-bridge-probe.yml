name: Private Bridge Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-bridge-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIVATE_SHA: d694168afdb206e61e10d14299b1ace6c029b89e
    steps:
      - name: Verify bridge secrets are present
        shell: bash
        env:
          PRIVATE_REPO_SSH_KEY: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          PRIVATE_STATUS_TOKEN: ${{ secrets.PRIVATE_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_REPO_SSH_KEY:-}" || { echo "::error::PRIVATE_REPO_SSH_KEY is missing"; exit 1; }
          test -n "${PRIVATE_STATUS_TOKEN:-}" || { echo "::error::PRIVATE_STATUS_TOKEN is missing"; exit 1; }

      - name: Checkout PR17 private source read-only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Validate PR17 workflow contract
        shell: bash
        run: |
          set +e
          python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            python -m pytest tests/test_workflow_contract.py -q > "$RUNNER_TEMP/test.log" 2>&1
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::PR17 workflow contract validation failed; private-source details are intentionally suppressed."
            exit "$status"
          fi
          echo "PR17 workflow contract: PASS"

      - name: Report probe status to private SHA
        if: always()
        shell: bash
        env:
          PRIVATE_STATUS_TOKEN: ${{ secrets.PRIVATE_STATUS_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_STATUS_TOKEN:-}" || { echo "::error::PRIVATE_STATUS_TOKEN is missing"; exit 1; }
          state=failure
          description="Public bridge credential probe failed"
          if [ "$JOB_STATUS" = success ]; then
            state=success
            description="Public bridge credentials and PR17 contract passed"
          fi
          payload=$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$TARGET_URL" python - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "public-ci/probe",
              "description": os.environ["DESCRIPTION"][:140],
              "target_url": os.environ["TARGET_URL"],
          }))
          PY
          )
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRIVATE_STATUS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MetaUoa/clash-relay/statuses/${PRIVATE_SHA}" \
            -d "$payload" > /dev/null
          echo "probe status reported: $state"
