    type: url-test
    hidden: true
    use: [AI]
    filter: '^\[AI:[^]]*U[^]]*\].*.+'
    exclude-filter: '(?i:🇯🇵|日本|东京|東京|大阪|JP|JPN|TYO|NRT|KIX|OSA|🇸🇬|新加坡|狮城|獅城|SG|SGP|SIN|🇺🇸|美国|美國|US|USA|LAX|SJC|SFO|SEA|NYC|JFK|IAD)'
