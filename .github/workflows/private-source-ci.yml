name: Public Contract CI

on:
  push:
    branches: [main]
    paths:
      - 'private-src/**'
      - 'public-harness/**'
      - 'source-ref.txt'
      - '.github/workflows/private-source-ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 0'

permissions:
  contents: read

concurrency:
  group: public-contract-ci
  cancel-in-progress: true

jobs:
  phase3a-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Verify sanitized snapshot source
        shell: bash
        run: |
          set -euo pipefail
          source_sha=$(head -n 1 source-ref.txt | tr -d '\r\n')
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          grep -F "$source_sha" private-src/config.template.yaml
          echo "Sanitized snapshot source: ${source_sha:0:12}"
      - name: Install contract dependencies
        run: python -m pip install pytest pyyaml
      - name: Phase3A production contract
        working-directory: private-src
        env:
          MIHOMO_REAL_SMOKE: '1'
        run: python -m pytest tests/test_phase3a_production_contract.py -q

  mihomo-core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Core harness dependencies
        run: python -m pip install pyyaml
      - name: Phase3A Mihomo Core v1.19.27-v1.19.30 runtime matrix
        run: python public-harness/phase3a_core_matrix.py
