  - name: 🤖 Grok SERVICE-FALLBACK
    type: fallback
    hidden: true
    proxies:
      - 🇯🇵 AI AUTO
      - 🇸🇬 AI AUTO
      - 🇺🇸 AI AUTO
      - 🌍 AI AUTO
      - 🤖 Grok NON-U AUTO
    empty-fallback: REJECT
  - name: 🤖 Grok NON-U AUTO
    type: url-test
    hidden: true
    use: [AI]
    filter: '^\[AI:[^]]*X[^]]*\].*.+'
    exclude-filter: '^\[AI:[^]]*U[^]]*\]'
    empty-fallback: REJECT

  - name: 🤖 AI
    type: select
    proxies:
      - 🤖 AI SERVICE-FALLBACK
      - 🇯🇵 AI AUTO
      - 🇸🇬 AI AUTO
      - 🇺🇸 AI AUTO
      - 🌍 AI AUTO
    empty-fallback: REJECT
  - name: 🤖 AI SERVICE-FALLBACK
