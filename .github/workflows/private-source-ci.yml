name: Private Source CI

on:
  push:
    branches: [main]
    paths:
      - source-ref.txt
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact MetaUoa/clash-relay commit SHA to verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: private-source-ci
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.ref.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: ref
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_SHA:-}" ]; then
            source_sha="$INPUT_SHA"
          else
            source_sha=$(head -n 1 source-ref.txt | tr -d '\r\n')
          fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Validating private source SHA: ${source_sha:0:12}"

  quality:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.10'
          cache: pip
      - name: Install development dependencies
        shell: bash
        run: python -m pip install -e '.[dev]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Ruff
        shell: bash
        run: |
          set +e
          python -m ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Ruff failed. Private-source details are intentionally suppressed."
            exit "$status"
          fi
          echo "Ruff: PASS"
      - name: Pytest coverage
        shell: bash
        run: |
          set +e
          python -m pytest --cov=clash_relay.candidate_diagnostics --cov=clash_relay.subscription_codec --cov=clash_relay.candidate_guard --cov=clash_relay.network_quality --cov=clash_relay.quality_probe --cov=clash_relay.cli --cov=clash_relay.config_secrets --cov=clash_relay.diagnose --cov=clash_relay.gist_publisher --cov=clash_relay.mihomo_controller --cov=clash_relay.mihomo_runtime --cov=clash_relay.mihomo_secret --cov=clash_relay.redact --cov=clash_relay.residential_verify --cov=clash_relay.route_probe --cov=clash_relay.routing_smoke --cov=clash_relay.subscription_analysis --cov=clash_relay.task_runtime --cov=scripts.ci_pipeline --cov=scripts.mihomo_compat_matrix --cov-branch --cov-report=term-missing --cov-fail-under=70 > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Pytest/coverage failed. Private-source details are intentionally suppressed."
            exit "$status"
          fi
          echo "Pytest coverage: PASS"
      - name: Native Mihomo API smoke
        env:
          MIHOMO_REAL_SMOKE: '1'
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_mihomo_integration.py -q -k native_auto_fallback_and_empty_reject > "$RUNNER_TEMP/native-smoke.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Native Mihomo API smoke failed. Private-source details are intentionally suppressed."
            exit "$status"
          fi
          echo "Native Mihomo API smoke: PASS"

  compatibility:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout private source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test dependencies (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Install test dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install '.[test]' *> "$env:RUNNER_TEMP\install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full pytest (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          python -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Compatibility pytest failed on ${{ runner.os }}. Private-source details are intentionally suppressed."
            exit "$status"
          fi
          echo "Compatibility ${{ runner.os }}: PASS"
      - name: Full pytest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pytest -q *> "$env:RUNNER_TEMP\pytest.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'Compatibility pytest failed on Windows. Private-source details are intentionally suppressed.'
            exit $LASTEXITCODE
          }
          Write-Output 'Compatibility Windows: PASS'
      - name: Verify non-editable install entrypoints
        run: >-
          python -c "import subprocess,sys,tempfile; code='import clash_relay.candidate_diagnostics,clash_relay.network_quality,clash_relay.quality_probe,clash_relay.subscription_codec,clash_relay.cli,clash_relay.diagnose,clash_relay.routing_smoke'; subprocess.run([sys.executable,'-c',code],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','diagnose','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','smoke-test','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)"

  mihomo-core:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.PRIVATE_REPO_READ_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Core matrix dependencies
        shell: bash
        run: python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Frozen strict Mihomo Core matrix
        env:
          MIHOMO_REAL_SMOKE: '1'
        shell: bash
        run: |
          set +e
          python scripts/mihomo_compat_matrix_frozen.py --report "$RUNNER_TEMP/frozen-matrix.json" --include-flclash > "$RUNNER_TEMP/frozen-core.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Frozen strict Mihomo Core matrix failed. Private-source details are intentionally suppressed."
            exit "$status"
          fi
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/frozen-matrix.json",encoding="utf-8")); print("Frozen matrix mode:",r.get("mode"))'
      - name: Production Mihomo Core matrix
        env:
          MIHOMO_REAL_SMOKE: '1'
        shell: bash
        run: |
          set +e
          python scripts/mihomo_compat_matrix.py --report "$RUNNER_TEMP/production-matrix.json" --include-flclash > "$RUNNER_TEMP/production-core.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::Production Mihomo Core matrix failed. Private-source details are intentionally suppressed."
            exit "$status"
          fi
          python -c 'import json,os; r=json.load(open(os.environ["RUNNER_TEMP"]+"/production-matrix.json",encoding="utf-8")); print("Production matrix mode:",r.get("mode"))'
