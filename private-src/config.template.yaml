      - 🤖 Gemini SERVICE-FALLBACK
    empty-fallback: REJECT
  - name: 🤖 Gemini SERVICE-FALLBACK
    type: fallback
    hidden: true
    proxies:
      - 🇯🇵 AI AUTO
      - 🇸🇬 AI AUTO
      - 🇺🇸 AI AUTO
      - 🌍 AI AUTO
      - 🤖 Gemini NON-U AUTO
    empty-fallback: REJECT
  - name: 🤖 Gemini NON-U AUTO
    type: url-test
    hidden: true
    use: [AI]
    filter: '^\[AI:[^]]*G[^]]*\].*.+'
