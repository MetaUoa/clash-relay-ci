# Final Phase3A U-primary topology represented by MetaUoa/clash-relay@d9f05d1a5cd4942db8669795a5086e27d3f531c1
# This file intentionally contains no subscription URLs, Gist credentials, source baseline, or node data.
proxy-providers:
  AI:
    type: inline
    payload: []

proxy-groups:
  - name: 🤖 ChatGPT
    type: select
    hidden: true
    proxies:
      - 🤖 ChatGPT SERVICE-FALLBACK
    empty-fallback: REJECT
  - name: 🤖 ChatGPT SERVICE-FALLBACK
    type: fallback
    hidden: true
    proxies:
      - 🇯🇵 AI AUTO
      - 🇸🇬 AI AUTO
      - 🇺🇸 AI AUTO
      - 🌍 AI AUTO
      - 🤖 ChatGPT NON-U AUTO
    empty-fallback: REJECT
  - name: 🤖 ChatGPT NON-U AUTO
    type: url-test
    hidden: true
    use: [AI]
    filter: '^\[AI:[^]]*O[^]]*\].*.+'
    exclude-filter: '^\[AI:[^]]*U[^]]*\]'
    empty-fallback: REJECT

  - name: 🤖 Claude
    type: select
    hidden: true
    proxies:
      - 🤖 Claude SERVICE-FALLBACK
    empty-fallback: REJECT
  - name: 🤖 Claude SERVICE-FALLBACK
    type: fallback
    hidden: true
    proxies:
      - 🇯🇵 AI AUTO
      - 🇸🇬 AI AUTO
      - 🇺🇸 AI AUTO
      - 🌍 AI AUTO
      - 🤖 Claude NON-U AUTO
    empty-fallback: REJECT
  - name: 🤖 Claude NON-U AUTO
    type: url-test
    hidden: true
    use: [AI]
    filter: '^\[AI:[^]]*C[^]]*\].*.+'
    exclude-filter: '^\[AI:[^]]*U[^]]*\]'
