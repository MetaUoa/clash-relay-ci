name: PR16 Ruff Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-pr16-ruff-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR16 prospective merge read-only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: refs/pull/16/merge
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install Ruff
        run: python -m pip install ruff > /dev/null 2>&1
      - name: Redacted Ruff diagnostics
        shell: bash
        run: |
          set +e
          python -m ruff check . --output-format json > "$RUNNER_TEMP/ruff.json"
          status=$?
          RUFF_JSON="$RUNNER_TEMP/ruff.json" python - <<'PY'
          import json, os
          data = json.load(open(os.environ['RUFF_JSON'], encoding='utf-8'))
          for item in data:
              loc = item.get('location') or {}
              print(f"{item.get('filename')}:{loc.get('row')}:{loc.get('column')} {item.get('code')} {item.get('message')}")
          print(f"ruff_diagnostics={len(data)}")
          PY
          exit "$status"
