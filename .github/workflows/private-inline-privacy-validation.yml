name: Private Inline Privacy Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-inline-privacy-validation.yml'

permissions:
  contents: read

concurrency:
  group: private-inline-privacy-validation
  cancel-in-progress: true

env:
  PRIVATE_SHA: b1c6fd770cdb57a9a15e7610862e9489b6d4d11d

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact private source read-only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install development dependencies
        shell: bash
        run: python -m pip install -e '.[dev]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Ruff
        shell: bash
        run: |
          set +e
          python -m ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Ruff failed; details suppressed."; exit "$status"; fi
          echo "Ruff: PASS"
      - name: Privacy regression tests
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_subscription_url_privacy.py > "$RUNNER_TEMP/privacy.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Privacy regression tests failed; details suppressed."; exit "$status"; fi
          echo "Privacy regression: PASS"
      - name: Pytest coverage
        shell: bash
        run: |
          set +e
          python -m pytest --cov=clash_relay.candidate_diagnostics --cov=clash_relay.subscription_codec --cov=clash_relay.candidate_guard --cov=clash_relay.network_quality --cov=clash_relay.quality_probe --cov=clash_relay.cli --cov=clash_relay.config_secrets --cov=clash_relay.diagnose --cov=clash_relay.gist_publisher --cov=clash_relay.mihomo_controller --cov=clash_relay.mihomo_runtime --cov=clash_relay.mihomo_secret --cov=clash_relay.redact --cov=clash_relay.residential_verify --cov=clash_relay.route_probe --cov=clash_relay.routing_smoke --cov=clash_relay.subscription_analysis --cov=clash_relay.task_runtime --cov=scripts.ci_pipeline --cov=scripts.mihomo_compat_matrix --cov-branch --cov-report=term-missing --cov-fail-under=70 > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Pytest/coverage failed; details suppressed."; exit "$status"; fi
          echo "Pytest coverage: PASS"
      - name: Native Mihomo API smoke
        env:
          MIHOMO_REAL_SMOKE: '1'
        shell: bash
        run: |
          set +e
          python -m pytest tests/test_mihomo_integration.py -q -k native_auto_fallback_and_empty_reject > "$RUNNER_TEMP/native.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Native Mihomo smoke failed; details suppressed."; exit "$status"; fi
          echo "Native Mihomo API smoke: PASS"

  compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Checkout exact private source read-only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install test dependencies Linux
        if: runner.os != 'Windows'
        shell: bash
        run: python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Install test dependencies Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install '.[test]' *> "$env:RUNNER_TEMP\install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Full pytest Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          python -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Ubuntu tests failed; details suppressed."; exit "$status"; fi
          echo "Ubuntu full pytest: PASS"
      - name: Full pytest Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pytest -q *> "$env:RUNNER_TEMP\pytest.log"
          if ($LASTEXITCODE -ne 0) { Write-Error 'Windows tests failed; details suppressed.'; exit $LASTEXITCODE }
          Write-Output 'Windows full pytest: PASS'
      - name: Verify non-editable entrypoints
        shell: bash
        run: >-
          python -c "import subprocess,sys,tempfile; code='import clash_relay.candidate_diagnostics,clash_relay.network_quality,clash_relay.quality_probe,clash_relay.subscription_codec,clash_relay.cli,clash_relay.diagnose,clash_relay.routing_smoke'; subprocess.run([sys.executable,'-c',code],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','diagnose','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','smoke-test','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)"

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout exact private source read-only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install Core dependencies
        shell: bash
        run: python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Frozen strict Core matrix
        env:
          MIHOMO_REAL_SMOKE: '1'
        shell: bash
        run: |
          set +e
          python scripts/mihomo_compat_matrix_frozen.py --report mihomo-frozen.json --include-flclash > "$RUNNER_TEMP/frozen.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Frozen Core failed; details suppressed."; exit "$status"; fi
          echo "Frozen strict Core: PASS"
      - name: Production strict Core matrix
        env:
          MIHOMO_REAL_SMOKE: '1'
        shell: bash
        run: |
          set +e
          python scripts/mihomo_compat_matrix.py --report mihomo-production.json --include-flclash > "$RUNNER_TEMP/production.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then echo "::error::Production Core failed; details suppressed."; exit "$status"; fi
          echo "Production strict Core: PASS"

  result:
    if: always()
    needs: [quality, compatibility, core]
    runs-on: ubuntu-latest
    steps:
      - name: Report private privacy gate status
        shell: bash
        env:
          PRIVATE_STATUS_TOKEN: ${{ secrets.PRIVATE_STATUS_TOKEN }}
          QUALITY: ${{ needs.quality.result }}
          COMPAT: ${{ needs.compatibility.result }}
          CORE: ${{ needs.core.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="Inline subscription privacy gate failed"
          if [ "$QUALITY" = success ] && [ "$COMPAT" = success ] && [ "$CORE" = success ]; then
            state=success
            description="Inline subscription privacy gate passed"
          fi
          payload=$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$TARGET_URL" python - <<'PY'
          import json, os
          print(json.dumps({
              "state": os.environ["STATE"],
              "context": "public-ci/privacy-complete",
              "description": os.environ["DESCRIPTION"],
              "target_url": os.environ["TARGET_URL"],
          }))
          PY
          )
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PRIVATE_STATUS_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/MetaUoa/clash-relay/statuses/${PRIVATE_SHA}" \
            -d "$payload" > /dev/null
          echo "privacy-complete=$state"
          test "$state" = success

# Repeat exact-source full gate after transient Frozen Core retry confirmed core-pass.
