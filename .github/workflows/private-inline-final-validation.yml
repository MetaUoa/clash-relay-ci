name: Private Inline Final Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/private-inline-final-validation.yml'

permissions:
  contents: read

env:
  PRIVATE_SHA: 8f43ee871d702dc7617f83d833da8add345fb668

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$PRIVATE_SHA"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
      - name: Install dev dependencies
        shell: bash
        run: python -m pip install -e '.[dev]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Ruff
        shell: bash
        run: python -m ruff check . > "$RUNNER_TEMP/ruff.log" 2>&1 || { echo '::error::Ruff failed; details suppressed.'; exit 1; }
      - name: Full coverage
        shell: bash
        run: |
          python -m pytest --cov=clash_relay.candidate_diagnostics --cov=clash_relay.subscription_codec --cov=clash_relay.candidate_guard --cov=clash_relay.network_quality --cov=clash_relay.quality_probe --cov=clash_relay.cli --cov=clash_relay.config_secrets --cov=clash_relay.diagnose --cov=clash_relay.gist_publisher --cov=clash_relay.mihomo_controller --cov=clash_relay.mihomo_runtime --cov=clash_relay.mihomo_secret --cov=clash_relay.redact --cov=clash_relay.residential_verify --cov=clash_relay.route_probe --cov=clash_relay.routing_smoke --cov=clash_relay.subscription_analysis --cov=clash_relay.task_runtime --cov=scripts.ci_pipeline --cov=scripts.mihomo_compat_matrix --cov-branch --cov-report=term-missing --cov-fail-under=70 > "$RUNNER_TEMP/pytest.log" 2>&1 || { echo '::error::Coverage/full pytest failed; details suppressed.'; exit 1; }
      - name: Native Mihomo smoke
        shell: bash
        env:
          MIHOMO_REAL_SMOKE: '1'
        run: python -m pytest tests/test_mihomo_integration.py -q -k native_auto_fallback_and_empty_reject > "$RUNNER_TEMP/native.log" 2>&1 || { echo '::error::Native Mihomo smoke failed; details suppressed.'; exit 1; }

  ubuntu313:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Full pytest
        shell: bash
        run: python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1 && python -m pytest -q > "$RUNNER_TEMP/pytest.log" 2>&1 || { echo '::error::Ubuntu 3.13 failed; details suppressed.'; exit 1; }
      - name: Non-editable entrypoints
        shell: bash
        run: >-
          python -c "import subprocess,sys,tempfile; code='import clash_relay.candidate_diagnostics,clash_relay.network_quality,clash_relay.quality_probe,clash_relay.subscription_codec,clash_relay.cli,clash_relay.diagnose,clash_relay.routing_smoke'; subprocess.run([sys.executable,'-c',code],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)"

  windows313:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Full pytest
        shell: pwsh
        run: |
          python -m pip install '.[test]' *> "$env:RUNNER_TEMP\install.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q *> "$env:RUNNER_TEMP\pytest.log"
          if ($LASTEXITCODE -ne 0) { Write-Error 'Windows 3.13 failed; details suppressed.'; exit $LASTEXITCODE }
      - name: Non-editable entrypoints
        shell: bash
        run: >-
          python -c "import subprocess,sys,tempfile; code='import clash_relay.candidate_diagnostics,clash_relay.network_quality,clash_relay.quality_probe,clash_relay.subscription_codec,clash_relay.cli,clash_relay.diagnose,clash_relay.routing_smoke'; subprocess.run([sys.executable,'-c',code],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); subprocess.run(['clash-relay','--help'],cwd=tempfile.mkdtemp(),check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)"

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: MetaUoa/clash-relay
          ref: ${{ env.PRIVATE_SHA }}
          ssh-key: ${{ secrets.PRIVATE_REPO_SSH_KEY }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Install Core dependencies
        shell: bash
        run: python -m pip install '.[test]' > "$RUNNER_TEMP/install.log" 2>&1
      - name: Frozen strict Core
        shell: bash
        env:
          MIHOMO_REAL_SMOKE: '1'
        run: |
          set +e
          python scripts/mihomo_compat_matrix_frozen.py --report "$RUNNER_TEMP/frozen.json" --include-flclash > "$RUNNER_TEMP/frozen.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            REPORT="$RUNNER_TEMP/frozen.json" python - <<'PY'
          import json, os, re
          data=json.load(open(os.environ['REPORT'], encoding='utf-8'))
          print('frozen_mode='+str(data.get('mode')))
          for item in data.get('results', []):
              if item.get('result') in {'PASS','UNVERIFIED','NOT_AVAILABLE'}: continue
              detail=str(item.get('detail') or '')
              print(json.dumps({'core':item.get('core'),'result':item.get('result'),'failure_kind':item.get('failure_kind'),'tests':sorted(set(re.findall(r'test=([^;\n]+)',detail)))},sort_keys=True))
          PY
            exit "$status"
          fi
          echo 'Frozen strict Core: PASS'
      - name: Production strict Core
        shell: bash
        env:
          MIHOMO_REAL_SMOKE: '1'
        run: |
          set +e
          python scripts/mihomo_compat_matrix.py --report "$RUNNER_TEMP/production.json" --include-flclash > "$RUNNER_TEMP/production.log" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            REPORT="$RUNNER_TEMP/production.json" python - <<'PY'
          import json, os, re
          data=json.load(open(os.environ['REPORT'], encoding='utf-8'))
          print('production_mode='+str(data.get('mode')))
          for item in data.get('results', []):
              if item.get('result') in {'PASS','UNVERIFIED','NOT_AVAILABLE'}: continue
              detail=str(item.get('detail') or '')
              print(json.dumps({'core':item.get('core'),'result':item.get('result'),'failure_kind':item.get('failure_kind'),'tests':sorted(set(re.findall(r'test=([^;\n]+)',detail)))},sort_keys=True))
          PY
            exit "$status"
          fi
          echo 'Production strict Core: PASS'

  result:
    if: always()
    needs: [quality, ubuntu313, windows313, core]
    runs-on: ubuntu-latest
    steps:
      - name: Report final privacy status
        shell: bash
        env:
          PRIVATE_STATUS_TOKEN: ${{ secrets.PRIVATE_STATUS_TOKEN }}
          QUALITY: ${{ needs.quality.result }}
          UBUNTU: ${{ needs.ubuntu313.result }}
          WINDOWS: ${{ needs.windows313.result }}
          CORE: ${{ needs.core.result }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description='Inline subscription privacy final gate failed'
          if [ "$QUALITY" = success ] && [ "$UBUNTU" = success ] && [ "$WINDOWS" = success ] && [ "$CORE" = success ]; then state=success; description='Inline subscription privacy final gate passed'; fi
          payload=$(STATE="$state" DESCRIPTION="$description" TARGET_URL="$TARGET_URL" python - <<'PY'
          import json, os
          print(json.dumps({'state':os.environ['STATE'],'context':'public-ci/privacy-complete','description':os.environ['DESCRIPTION'],'target_url':os.environ['TARGET_URL']}))
          PY
          )
          curl -fsS -X POST -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${PRIVATE_STATUS_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/MetaUoa/clash-relay/statuses/${PRIVATE_SHA}" -d "$payload" > /dev/null
          echo "public-ci/privacy-complete=$state"
          test "$state" = success
